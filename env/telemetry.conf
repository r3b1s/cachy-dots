# Telemetry and phone-home opt-outs, on by default for the whole session.
#
# One file, three readers, so every process sees the same values:
#   * systemd --user, via ~/.config/environment.d/telemetry.conf (a link here),
#     for user services and anything D-Bus/systemd activates
#   * the i3 session, sourced by ~/.xprofile (shell/xprofile)
#   * interactive bash, sourced by shell/init.sh
# That is why the format is the strict common subset: KEY=VALUE, no `export`,
# no quotes, no spaces; environment.d(5) accepts it and so does `. file`.
#
# Some of these disable things that can be useful: NPM_CONFIG_AUDIT=false skips
# npm's automatic audit on install. Delete a line to restore a tool's default.

# ── AI tools ──
GEMINI_TELEMETRY_ENABLED=false
RTK_TELEMETRY_DISABLED=1
CRUSH_DISABLE_METRICS=1

# ── shells ──
POWERSHELL_TELEMETRY_OPTOUT=1

# ── package and version managers ──
NPM_CONFIG_FUND=false
NPM_CONFIG_AUDIT=false
NPM_CONFIG_UPDATE_NOTIFIER=false
HOMEBREW_NO_ANALYTICS=1
PIP_DISABLE_PIP_VERSION_CHECK=1
MISE_USE_VERSIONS_HOST_TRACK=false

# ── generic catch-alls ──
DISABLE_TELEMETRY=1
DO_NOT_TRACK=1

# ── cloud and network CLIs ──
AZURE_CORE_COLLECT_TELEMETRY=0
CHECKPOINT_DISABLE=1
GH_NO_TELEMETRY=1
SAM_CLI_TELEMETRY=0
WRANGLER_SEND_METRICS=false
NETBIRD_DISABLE_ANONYMOUS_METRICS=true

# ── frameworks ──
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_UPGRADEASSISTANT_TELEMETRY_OPTOUT=1
ASTRO_TELEMETRY_DISABLED=1
NG_CLI_ANALYTICS=false
EXPO_NO_TELEMETRY=1
GATSBY_TELEMETRY_DISABLED=1
NEXT_TELEMETRY_DISABLED=1
NUXT_TELEMETRY_DISABLED=1
REDWOOD_TELEMETRY_DISABLED=1
SLS_TELEMETRY_DISABLED=1
STORYBOOK_DISABLE_TELEMETRY=1
STORYBOOK_ENABLE_CRASH_REPORTS=0
TURBO_TELEMETRY_DISABLED=1

# ── infrastructure ──
PULUMI_SKIP_UPDATE_CHECK=true
PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION=true

# ── uncategorised ──
ALGOLIA_CLI_TELEMETRY=0
