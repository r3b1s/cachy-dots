# Hardened sshd, opt-in: install.sh does not install this and does not enable
# sshd. To use it, enable sshd yourself, put your key in ~/.ssh/authorized_keys
# first (this turns password logins off), then copy this file to
# /etc/ssh/sshd_config.d/ and run `sudo sshd -t && sudo systemctl reload sshd`.
# Arch's sshd_config Includes sshd_config.d/*.conf at its top, and the first
# value set for a keyword wins, so these override the main file.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
