# Safe sshd defaults. Installed to /etc/ssh/sshd_config.d/ by install.sh, which
# leaves the service itself alone: CachyOS enables sshd, and on a headless host
# it is the way in, so these apply as soon as install.sh reloads it. Arch's
# sshd_config Includes sshd_config.d/*.conf at its top, and the first value
# set for a keyword wins, so these override the main file.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
