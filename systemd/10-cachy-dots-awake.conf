# Installed by the vm profile (setup_no_sleep in install/system.sh) into
# /etc/systemd/logind.conf.d/. A guest has no battery, lid or idle policy of its
# own: logind must never suspend, hibernate or act on idleness. The power key
# is left alone (it is a deliberate shutdown).
[Login]
IdleAction=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
