# Installed by opt/hibernate.sh into /etc/systemd/logind.conf.d/. Closing the lid
# suspends, then hibernates after HibernateDelaySec (the sleep.conf.d drop-in), on
# battery and on AC alike: hibernated, the machine is off and the LUKS key is out
# of RAM until the passphrase is typed again. A docked lid is left to logind.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
