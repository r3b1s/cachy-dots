<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<!-- Nothing but the desktop background. bin/x11-wallpaper keeps the current
     feh image pointed at by ../wallpapers/current (i.e. ~/.config/wallpapers,
     which install.sh seeds); feh's own ~/.fehbg is a shell script, not
     something a browser can render, so it cannot be used here. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #050007 url("../wallpapers/current") center center / cover no-repeat fixed;
  }
  /* Vignette: the edges fade towards black, the centre is untouched. */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 45%, rgba(0, 0, 0, 0.35) 75%, rgba(0, 0, 0, 0.7) 100%);
  }
</style>
</head>
<body></body>
</html>
