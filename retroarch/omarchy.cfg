# RetroArch settings Omarchy applies (bin/omarchy-install-gaming-retroarch in
# basecamp/omarchy), merged into ~/.config/retroarch/retroarch.cfg by
# opt/omarchy-retroarch.sh. One `key = "value"` per line; @HOME@ is the home
# directory. Not linked: RetroArch rewrites its config on exit.

# ROMs and BIOS files
rgui_browser_directory = "@HOME@/Games/roms"
system_directory = "@HOME@/Games/bios"

# The cores and data the packages install
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
overlay_directory = "/usr/share/libretro/overlays"
osk_overlay_directory = "/usr/share/libretro/overlays/keyboards"
video_shader_dir = "/usr/share/libretro/shaders/shaders_slang"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

# From libretro-database-git
content_database_path = "/usr/share/libretro/database/rdb"
cheat_database_path = "/usr/share/libretro/database/cht"
cursor_directory = "/usr/share/libretro/database/cursors"

# Vulkan: needed by the slang shaders, and unlocks the hardware renderers in
# beetle-psx-hw, parallel-n64 and dolphin
video_driver = "vulkan"

# XMB, the PS3-style menu, instead of rgui/ozone/glui
menu_driver = "xmb"

# The CRT shader preset (retroarch/global.slangp) is loaded automatically when
# these are on and no per-core or per-game preset takes precedence
video_shader_enable = "true"
auto_shaders_enable = "true"

# Hide the Images and Video tabs in the main menu
content_show_images = "false"
content_show_video = "false"
