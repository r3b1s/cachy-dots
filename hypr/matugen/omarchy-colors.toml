# dux's palette as an omarchy-format colors.toml. A matugen template: dux renders
# it with its own templates on every colour change (install/session.sh adds it
# through ~/.config/matugen/dms/configs/cachy-dots.toml), and its post_hook then
# runs `x11-theme from-dux`, which renders cachy-dots' app templates (Firefox,
# Chromium and Brave Origin, qutebrowser, btop, yazi, tmux, ...) from this file.
mode = "{{mode}}"

accent = "{{colors.primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"
selection = "{{colors.primary_container.default.hex}}"
selection_foreground = "{{colors.on_primary_container.default.hex}}"
muted = "{{colors.outline.default.hex}}"

background = "{{colors.background.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

# The 16 ANSI colours: dux's dank16, which it builds for terminals and editors.
color0 = "{{dank16.color0.default.hex}}"
color1 = "{{dank16.color1.default.hex}}"
color2 = "{{dank16.color2.default.hex}}"
color3 = "{{dank16.color3.default.hex}}"
color4 = "{{dank16.color4.default.hex}}"
color5 = "{{dank16.color5.default.hex}}"
color6 = "{{dank16.color6.default.hex}}"
color7 = "{{dank16.color7.default.hex}}"
color8 = "{{dank16.color8.default.hex}}"
color9 = "{{dank16.color9.default.hex}}"
color10 = "{{dank16.color10.default.hex}}"
color11 = "{{dank16.color11.default.hex}}"
color12 = "{{dank16.color12.default.hex}}"
color13 = "{{dank16.color13.default.hex}}"
color14 = "{{dank16.color14.default.hex}}"
color15 = "{{dank16.color15.default.hex}}"
