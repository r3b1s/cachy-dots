# The Executor guest's desktop, logged in as tbird at boot: a subset of
# cachy-dots' i3 bindings (i3/conf.d), on the same chords. Reached with
# `incus console cs-executor --type=vga`.
#
# Thunderbird is a systemd user unit that restarts whenever it exits (the MCP
# add-on lives in it), so there is no logout here: the session must stay up.

set $mod Mod4
set $terminal alacritty

font pango:JetBrainsMono Nerd Font 9
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
floating_modifier $mod
focus_follows_mouse yes

# ── Session ──────────────────────────────────────────────────────────────────
# No blanking or locking: nobody watches this screen.
exec --no-startup-id xset s off -dpms
# Clipboard and display size through the SPICE console.
exec --no-startup-id spice-vdagent
exec --no-startup-id systemctl --user import-environment DISPLAY XAUTHORITY && systemctl --user start thunderbird.service

# Thunderbird lives on the workspace its chord names (20-workspaces.conf).
assign [class="(?i)thunderbird"] equal
bindsym $mod+equal workspace equal

# ── Launchers (30-apps.conf, 70-apps.conf) ───────────────────────────────────
bindsym $mod+Return exec --no-startup-id rofi -show drun
bindsym $mod+space exec --no-startup-id rofi -show run
bindsym $mod+Mod1+space exec --no-startup-id rofi -show window
bindsym $mod+Shift+t exec --no-startup-id $terminal
bindsym $mod+b exec --no-startup-id firefox-esr

# ── Windows (40-modes.conf) ──────────────────────────────────────────────────
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+n focus parent
bindsym $mod+Shift+n focus child

bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+Ctrl+h resize grow width 100 px or 6 ppt
bindsym $mod+Ctrl+l resize shrink width 100 px or 6 ppt
bindsym $mod+Ctrl+k resize grow height 100 px or 6 ppt
bindsym $mod+Ctrl+j resize shrink height 100 px or 6 ppt

bindsym $mod+w kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+Ctrl+Mod1+f floating toggle
bindsym $mod+Shift+Ctrl+Mod1+space focus mode_toggle
bindsym $mod+s layout toggle tabbed split
bindsym $mod+Shift+s layout toggle stacking split
bindsym $mod+Ctrl+s split toggle
bindsym $mod+Mod1+BackSpace layout toggle all

# ── Workspaces (20-workspaces.conf) ──────────────────────────────────────────
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace number 10
bindsym $mod+Tab workspace next
bindsym $mod+Ctrl+Tab workspace back_and_forth

# ── i3 itself ────────────────────────────────────────────────────────────────
bindsym $mod+Shift+r reload
bindsym $mod+Shift+Ctrl+Mod1+c reload
bindsym $mod+Shift+Ctrl+Mod1+w restart

bar {
    position top
    status_command i3status
}
