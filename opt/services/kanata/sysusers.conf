# Installed by opt/services/kanata/install.sh to /etc/sysusers.d/kanata.conf and applied with
# systemd-sysusers. kanata.service runs as this user. It reads the keyboards through
# the input group, and it writes the virtual keyboard through /dev/uinput, which
# udev gives to the uinput group (see udev.rules). Order matters: the uinput group
# is created before the udev rule that names it is loaded.
#Type Name   ID  GECOS                    Home Shell
u      kanata -   "kanata keyboard remapper" -    -
m      kanata input
g      uinput -
m      kanata uinput
