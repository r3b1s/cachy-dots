# alacritty — the default terminal ($terminal in i3/config). Colours come from
# the active theme (x11-theme renders omarchy's alacritty.toml.tpl). x11-theme
# touches this file after a switch, which is what makes alacritty reload.

[general]
import = ["~/.local/state/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift",   action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift",   chars = "\u001B\r" }
]
