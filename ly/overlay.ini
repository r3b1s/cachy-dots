# Overlay for ly, merged into /etc/ly/config.ini by install.sh.
#
# NOT a standalone config: ly reads exactly one file, /etc/ly/config.ini
# (a compile-time path in its source), with no per-user fallback. So this is a set
# of keys to substitute into the packaged file; everything not listed here keeps
# the packaged value. Only keys ly 1.4.1 actually parses work; anything else is
# silently ignored.
#
# Colours are not here: they follow the active theme. x11-theme renders
# theme/default/themed/ly.ini.tpl and writes those keys through the root helper
# theme/root/ly-theme-colors.

# The guest keyboard has no hardware numlock state to inherit.
numlock = true
