# Look and feel basics. Window colours are in 01-pinkrot.conf.

font pango:JetBrainsMono Nerd Font 9

default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart

# Enforce window borders for apps not playing nice.
for_window [class="(?i)obsidian"] border pixel 2
for_window [class="Alacritty"] border pixel 2
for_window [class="(?i)com\.anthropic\.Claude"] border pixel 2

# Zero gaps by default for max screen efficiency. $mod+Shift+BackSpace still
# cycles presets via bin/x11-gaps-cycle when gaps are wanted.
gaps inner 0
gaps outer 0

floating_modifier $mod
focus_follows_mouse yes
