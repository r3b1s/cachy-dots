# Workspaces: numbered, named, and window routing.
#
# The named workspaces below are ordinary i3 workspaces toggled by x11-ws-app.
# i3's own scratchpad is deliberately unused, so $mod+minus swaps to the
# `sup_minus` workspace, not to a scratchpad.

# ── numbered workspaces ───────────────────────────────────────────────────

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move window and follow it (hyprland's default move behavior).
bindsym $mod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace number 10

# Move window silently (stay on the current workspace).
bindsym $mod+Shift+Mod1+1 move container to workspace number 1
bindsym $mod+Shift+Mod1+2 move container to workspace number 2
bindsym $mod+Shift+Mod1+3 move container to workspace number 3
bindsym $mod+Shift+Mod1+4 move container to workspace number 4
bindsym $mod+Shift+Mod1+5 move container to workspace number 5
bindsym $mod+Shift+Mod1+6 move container to workspace number 6
bindsym $mod+Shift+Mod1+7 move container to workspace number 7
bindsym $mod+Shift+Mod1+8 move container to workspace number 8
bindsym $mod+Shift+Mod1+9 move container to workspace number 9
bindsym $mod+Shift+Mod1+0 move container to workspace number 10

# ── workspace navigation ──────────────────────────────────────────────────

bindsym $mod+Tab workspace next
# Shift+Tab emits ISO_Left_Tab on X11, so bind the keycode (Tab = 23).
bindcode $mod+Shift+23 workspace prev
bindsym $mod+Ctrl+Tab workspace back_and_forth

# ── monitors ──────────────────────────────────────────────────────────────

bindsym Ctrl+Mod1+Tab focus output next

bindsym $mod+Shift+Mod1+Left move workspace to output left
bindsym $mod+Shift+Mod1+Right move workspace to output right
bindsym $mod+Shift+Mod1+Up move workspace to output up
bindsym $mod+Shift+Mod1+Down move workspace to output down

# ── named workspaces ──────────────────────────────────────────────────────
# x11-ws-app toggles the workspace and launches the command when it's empty,
# mimicking hyprland's on_created_empty special workspaces. Each is a real,
# addressable workspace: it can be swapped to, moved to, and shown in the bar.
# Names are the condensed keybinding form (sup_t = super+t), matching the hyprland
# special-workspace names in quattro-dots, so the bar label shows which chord
# reaches the workspace.

# App-launching workspaces (browser, obsidian) live in 70-apps.conf.

# terminals
bindsym $mod+t exec --no-startup-id $bin/x11-ws-app "sup_t" $terminal
bindsym $mod+Shift+Ctrl+t move container to workspace sup_t

bindsym $mod+g exec --no-startup-id $bin/x11-ws-app "sup_g" $terminal
bindsym $mod+Shift+Ctrl+g move container to workspace sup_g

# system tools
bindsym $mod+p exec --no-startup-id $bin/x11-ws-app "sup_p" $terminal-cmd btop
bindsym $mod+Shift+Ctrl+p move container to workspace sup_p

# plain workspace: switches only, launches nothing (sup_sft_p = super+shift+p)
bindsym $mod+Shift+p workspace sup_sft_p

# empty utility workspaces
bindsym $mod+period exec --no-startup-id $bin/x11-ws-app "sup_period"
bindsym $mod+Shift+Ctrl+period move container to workspace sup_period

bindsym $mod+minus exec --no-startup-id $bin/x11-ws-app "sup_minus"
bindsym $mod+Shift+Ctrl+minus move container to workspace sup_minus

bindsym $mod+a exec --no-startup-id $bin/x11-ws-app "sup_a"
bindsym $mod+Shift+Ctrl+a move container to workspace sup_a

bindsym $mod+y exec --no-startup-id $bin/x11-ws-app "sup_y"
bindsym $mod+Shift+Ctrl+y move container to workspace sup_y

bindsym $mod+i exec --no-startup-id $bin/x11-ws-app "sup_i"
bindsym $mod+Shift+Ctrl+i move container to workspace sup_i

bindsym $mod+m exec --no-startup-id $bin/x11-ws-app "sup_m"
bindsym $mod+Shift+Ctrl+m move container to workspace sup_m

bindsym $mod+q exec --no-startup-id $bin/x11-ws-app "sup_q"
bindsym $mod+Shift+Ctrl+q move container to workspace sup_q

bindsym $mod+slash exec --no-startup-id $bin/x11-ws-app "sup_slash"
bindsym $mod+Shift+Ctrl+slash move container to workspace sup_slash

bindsym $mod+comma exec --no-startup-id $bin/x11-ws-app "sup_comma"
bindsym $mod+Shift+Ctrl+comma move container to workspace sup_comma

bindsym $mod+equal exec --no-startup-id $bin/x11-ws-app "sup_equal"
bindsym $mod+Shift+Ctrl+equal move container to workspace sup_equal

# ── window routing ────────────────────────────────────────────────────────
# `assign` rules (pin an app's windows to a workspace by class) live in
# 70-apps.conf next to the app they belong to.

# floating dialogs
for_window [window_role="pop-up"] floating enable
