# Launchers, terminals, notifications, volume, utilities.
# Application launch binds live in 70-apps.conf.

# ── launchers (rofi) ──────────────────────────────────────────────────────

# Desktop applications.
bindsym $mod+Return exec --no-startup-id rofi -show drun
# Raw PATH binaries.
bindsym $mod+space exec --no-startup-id rofi -show run
# Window switcher.
bindsym $mod+Mod1+space exec --no-startup-id rofi -show window
# System/power menu.
bindsym $mod+Escape exec --no-startup-id $bin/x11-power-menu
bindsym XF86PowerOff exec --no-startup-id $bin/x11-power-menu
# Keybinding cheatsheet.
bindsym $mod+Shift+Ctrl+Mod1+k exec --no-startup-id $bin/x11-keybinds-menu

# ── terminals ─────────────────────────────────────────────────────────────

# New terminal, in whichever workspace is focused.
bindsym $mod+Shift+t exec --no-startup-id $terminal

# ── notifications (dunst) ─────────────────────────────────────────────────

bindsym $mod+x exec --no-startup-id dunstctl close
bindsym $mod+Shift+x exec --no-startup-id dunstctl close-all
bindsym $mod+Ctrl+x exec --no-startup-id dunstctl set-paused toggle
bindsym $mod+Mod1+x exec --no-startup-id dunstctl history-pop

# ── volume ────────────────────────────────────────────────────────────────
# pipewire-pulse provides pactl; x11-volume wraps it with a dunst OSD.

bindsym XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up
bindsym XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down
bindsym Mod1+XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up-fine
bindsym Mod1+XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down-fine
bindsym XF86AudioMute exec --no-startup-id $bin/x11-volume mute
bindsym XF86AudioMicMute exec --no-startup-id $bin/x11-volume mic-mute
# Same toggle for keyboards without the key; the bar's microphone block shows it.
bindsym $mod+Shift+m exec --no-startup-id $bin/x11-volume mic-mute

# ── dictation (voxtype) ───────────────────────────────────────────────────

# Toggle recording; the transcript is pasted at the cursor (bin/x11-voxtype).
bindsym $mod+d exec --no-startup-id $bin/x11-voxtype toggle

# ── media / brightness ────────────────────────────────────────────────────
# playerctl drives whichever MPRIS player is active (mpv, browsers, Vesktop).

bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioStop exec --no-startup-id playerctl stop
# Backlight (brightnessctl), with an OSD; Mod1 for fine steps.
bindsym XF86MonBrightnessUp exec --no-startup-id $bin/x11-brightness up
bindsym XF86MonBrightnessDown exec --no-startup-id $bin/x11-brightness down
bindsym Mod1+XF86MonBrightnessUp exec --no-startup-id $bin/x11-brightness up-fine
bindsym Mod1+XF86MonBrightnessDown exec --no-startup-id $bin/x11-brightness down-fine

# ── screenshots ───────────────────────────────────────────────────────────
# maim + xclip. Region goes to the clipboard; full is saved to ~/Pictures too.
# The annotate variants open the capture in satty (Enter copies, Ctrl+S saves).

bindsym $mod+semicolon exec --no-startup-id $bin/x11-screenshot region
bindsym Print exec --no-startup-id $bin/x11-screenshot full
# Copy the text in a selected region (tesseract OCR), as omarchy's SUPER+PRINT.
bindsym $mod+Print exec --no-startup-id $bin/x11-screenshot ocr
# Annotate a region in satty.
bindsym $mod+Shift+semicolon exec --no-startup-id $bin/x11-screenshot annotate-region
# Annotate the whole screen in satty.
bindsym $mod+Ctrl+semicolon exec --no-startup-id $bin/x11-screenshot annotate-full

# satty is an editor over the screenshot, not a tile.
for_window [class="(?i)satty"] floating enable, fullscreen enable
for_window [class="(?i)pavucontrol"] floating enable

# ── theme ─────────────────────────────────────────────────────────────────

# Theme switcher: a grid of the installed omarchy themes' previews (x11-theme).
bindsym $mod+Shift+Ctrl+space exec --no-startup-id $bin/x11-theme menu
# Background switcher: a grid of the current theme's backgrounds.
bindsym $mod+Ctrl+space exec --no-startup-id $bin/x11-wallpaper menu
# Next wallpaper from the theme's backgrounds.
bindsym $mod+Ctrl+w exec --no-startup-id $bin/x11-wallpaper next

# ── lock / idle / nightlight ─────────────────────────────────────────────────────

# Lock the screen (i3lock-color, pinkrot). Also in the $mod+Escape menu.
bindsym $mod+Ctrl+Escape exec --no-startup-id $bin/x11-lock
# Idle inhibit: no auto-lock, display blanking or sleep while it is on; a coffee
# cup shows in the bar. A closed laptop lid still acts as logind says.
bindsym $mod+Ctrl+i exec --no-startup-id $bin/x11-idle toggle
# Toggle the nightlight (gammastep, 4000K).
bindsym $mod+Ctrl+n exec --no-startup-id $bin/x11-nightlight toggle

# ── clipboard / picker ────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+p exec --no-startup-id "xcolor | xclip -selection clipboard && dunstify -a cachy-dots 'Color copied to clipboard'"
# Clipboard history (CopyQ) in rofi.
bindsym $mod+Ctrl+v exec --no-startup-id $bin/x11-clipboard history
# Wipe the clipboard and its whole history.
bindsym $mod+Shift+Ctrl+Mod1+v exec --no-startup-id $bin/x11-clipboard wipe
bindsym $mod+Ctrl+e exec --no-startup-id rofimoji
