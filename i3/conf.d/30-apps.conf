# Launchers, terminals, notifications, volume, utilities.
# Application launch binds live in 70-apps.conf.

# ── launchers (rofi) ──────────────────────────────────────────────────────

# Desktop applications.
bindsym $mod+Return exec --no-startup-id rofi -show drun
# Raw PATH binaries.
bindsym $mod+space exec --no-startup-id rofi -show run
# Window switcher.
bindsym $mod+Ctrl+space exec --no-startup-id rofi -show window
# System/power menu.
bindsym $mod+Escape exec --no-startup-id $bin/x11-power-menu
bindsym XF86PowerOff exec --no-startup-id $bin/x11-power-menu
# Keybinding cheatsheet.
bindsym $mod+Shift+Ctrl+Mod1+k exec --no-startup-id $bin/x11-keybinds-menu

# ── terminals ─────────────────────────────────────────────────────────────

# New terminal, in whichever workspace is focused.
bindsym $mod+Shift+t exec --no-startup-id $terminal

# ── notifications (dunst) ─────────────────────────────────────────────────

bindsym $mod+x exec --no-startup-id dunstctl close
bindsym $mod+Shift+x exec --no-startup-id dunstctl close-all
bindsym $mod+Ctrl+x exec --no-startup-id dunstctl set-paused toggle
bindsym $mod+Mod1+x exec --no-startup-id dunstctl history-pop

# ── volume ────────────────────────────────────────────────────────────────
# pipewire-pulse provides pactl; x11-volume wraps it with a dunst OSD.

bindsym XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up
bindsym XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down
bindsym Mod1+XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up-fine
bindsym Mod1+XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down-fine
bindsym XF86AudioMute exec --no-startup-id $bin/x11-volume mute
bindsym XF86AudioMicMute exec --no-startup-id $bin/x11-volume mic-mute

# ── screenshots ───────────────────────────────────────────────────────────
# maim + xclip. Region goes to the clipboard; full is saved to ~/Pictures too.

bindsym $mod+semicolon exec --no-startup-id $bin/x11-screenshot region
bindsym Print exec --no-startup-id $bin/x11-screenshot full

# ── clipboard / picker ────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+p exec --no-startup-id "xcolor | xclip -selection clipboard && dunstify -a cachy-dots 'Color copied to clipboard'"
bindsym $mod+Shift+Ctrl+Mod1+v exec --no-startup-id "printf '' | xclip -selection clipboard && dunstify -a cachy-dots 'Clipboard cleared'"
bindsym $mod+Ctrl+e exec --no-startup-id rofimoji
