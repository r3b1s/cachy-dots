# Window colours, from the active theme. The $th_* variables are defined in
# ~/.local/state/omarchy/current/theme/i3.conf, which x11-theme renders from
# theme/default/themed/i3.conf.tpl and i3/config includes before conf.d/.
# Bar colours live in 15-bar.conf (a `bar` block can't be split across includes).

#                       border        backgr        text      indicator     child_border
client.focused          $th_accent    $th_accent    $th_bg    $th_indicator $th_accent
client.focused_inactive $th_accent_dim $th_bg_light $th_fg    $th_accent_dim $th_accent_dim
client.unfocused        $th_bg_light  $th_bg        $th_fg_dim $th_bg_light $th_bg_light
client.urgent           $th_urgent    $th_urgent_bg $th_fg_bright $th_urgent $th_urgent
client.placeholder      $th_bg        $th_bg        $th_fg    $th_bg        $th_bg
client.background       $th_bg
