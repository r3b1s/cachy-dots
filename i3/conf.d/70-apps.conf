# Application launching. qutebrowser is the main browser.
#
# A named workspace (ws-app) toggles to the app's workspace and launches it
# if that workspace is empty; the direct bind always opens a new window.
# x names match the chord that reaches them (see 20-workspaces.conf).

# Browser workspace.
bindsym $mod+u exec --no-startup-id $bin/ws-app "u" qutebrowser
bindsym $mod+Shift+Ctrl+u move container to workspace u

# Direct launches.
# The default browser (set from the $mod+Escape menu), and the same in private browsing.
bindsym $mod+b exec --no-startup-id $bin/default-browser launch
bindsym $mod+Shift+Ctrl+b exec --no-startup-id $bin/default-browser launch --private
bindsym $mod+Shift+b exec --no-startup-id qutebrowser
bindsym $mod+Ctrl+b exec --no-startup-id firefox
bindsym $mod+Mod1+b exec --no-startup-id chromium
bindsym $mod+e exec --no-startup-id nautilus --new-window
bindsym $mod+Shift+e exec --no-startup-id $terminal-cmd yazi

# Obsidian workspace.
bindsym $mod+o exec --no-startup-id $bin/ws-app "o" obsidian
bindsym $mod+Shift+o exec --no-startup-id obsidian
bindsym $mod+Shift+Ctrl+o move container to workspace o

# Web Proxy workspace (zaproxy)
bindsym $mod+z exec --no-startup-id "$bin/ws-app --notify 'ZAProxy' 'now launching...' 'z' zaproxy"
bindsym $mod+Shift+Ctrl+z move container to workspace z

# ── window routing ────────────────────────────────────────────────────────
# `assign` pins every window of a matching app to a workspace, whichever
# workspace it was launched from. Syntax:
#   assign [class="(?i)appname"] <workspace>
# Find the class of a running window with `xprop WM_CLASS` (click the window).
# None needed yet.

# Web Proxy windows
assign [class="org-zaproxy-zap-ZAP" title="ZAP"] z
