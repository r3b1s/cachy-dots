# Application launching. qutebrowser is the main browser.
#
# A named workspace (x11-ws-app) toggles to the app's workspace and launches it
# if that workspace is empty; the direct bind always opens a new window.
# sup_x names match the chord that reaches them (see 20-workspaces.conf).

# Browser workspace.
bindsym $mod+u exec --no-startup-id $bin/x11-ws-app "sup_u" qutebrowser
bindsym $mod+Shift+Ctrl+u move container to workspace sup_u

# Direct launches.
bindsym $mod+b exec --no-startup-id qutebrowser
bindsym $mod+Shift+b exec --no-startup-id firefox
bindsym $mod+Ctrl+b exec --no-startup-id chromium
bindsym $mod+e exec --no-startup-id nautilus
bindsym $mod+Shift+e exec --no-startup-id $terminal-cmd yazi

# Obsidian workspace.
bindsym $mod+o exec --no-startup-id $bin/x11-ws-app "sup_o" obsidian
bindsym $mod+Shift+o move container to workspace sup_o

# Web Proxy workspace (zaproxy)
bindsym $mod+z exec --no-startup-id "$bin/x11-ws-app --notify 'ZAProxy' 'now launching...' 'sup_z' zaproxy"
bindsym $mod+Shift+Ctrl+z move container to workspace sup_z

# ── window routing ────────────────────────────────────────────────────────
# `assign` pins every window of a matching app to a workspace, whichever
# workspace it was launched from. Syntax:
#   assign [class="(?i)appname"] <workspace>
# Find the class of a running window with `xprop WM_CLASS` (click the window).
# None needed yet.

# Web Proxy windows
assign [class="org-zaproxy-zap-ZAP" title="ZAP"] sup_z
