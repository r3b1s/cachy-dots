# Autostart. i3 does not run /etc/xdg/autostart, so anything that normally
# relies on an XDG autostart entry (spice-vdagent, nm-applet…) is started here.

# Tiling behaviour: pick split direction from the focused window's shape.
exec_always --no-startup-id autotiling

# Notifications.
exec --no-startup-id dunst

# Polkit authentication agent (pkexec / virt-manager-style prompts).
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# NetworkManager tray applet (shows in the i3bar tray).
exec --no-startup-id nm-applet

# SPICE guest agent: shared clipboard and automatic display resize.
# The system half is spice-vdagentd.service (enabled by install.sh).
exec --no-startup-id spice-vdagent

exec --no-startup-id numlockx on

# Clipboard history (CopyQ, with its tray icon). bin/x11-clipboard drives it
# from rofi: $mod+Ctrl+v to pick, $mod+Shift+Ctrl+Mod1+v to wipe.
exec --no-startup-id copyq

# Lock before suspend, and after 10 idle minutes (the X screensaver timer, which
# xss-lock watches). --transfer-sleep-lock holds suspend until the screen is
# actually locked; bin/x11-lock execs i3lock --nofork for exactly that.
exec --no-startup-id xset s 600 600
exec --no-startup-id xss-lock --transfer-sleep-lock -- $bin/x11-lock

# Bluetooth tray applet, only when there is an adapter (none in a VM).
exec --no-startup-id sh -c '[ -n "$(ls -A /sys/class/bluetooth 2>/dev/null)" ] && exec blueman-applet'

# Monitor, then wallpaper: one shell, in that order.
#
# These were two separate exec_always lines, which i3 starts *concurrently*. feh
# would paint while the screen was still at the preferred mode - 1280x800 on this
# GPU - and then x11-monitor switched to 1920x1080, leaving a 1280x800 root
# pixmap that X tiles across the now-larger root window. The wallpaper repeated
# every 1280px, with a matching seam at y=800, on every fresh login.
# Reproduced and fixed on the VM: paint at 1280x800, grow to 1920x1080, and the
# left and right halves match to within 0.00/255; run these two in sequence and
# they differ by 8.80, i.e. the correct image.
#
# i3's exec does not use a shell (no pipes, redirections or arithmetic), so the
# sequencing needs an explicit sh -c. A reload re-runs all of this, which is how
# $mod+Shift+r reshuffles the wallpaper.
exec_always --no-startup-id sh -c '$bin/x11-monitor 1920x1080 && $bin/x11-wallpaper' 
