# Autostart. i3 does not run /etc/xdg/autostart, so anything that normally
# relies on an XDG autostart entry (spice-vdagent, nm-applet…) is started here.

# The user manager can outlive a logout by a few seconds, so a quick switch from the
# Hyprland session (bin/cachy-session) finds its environment and portals still
# there. Hand D-Bus activation this session's display and desktop, drop
# Hyprland's, and stop the portals so the next request starts them for i3.
exec --no-startup-id sh -c 'dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; systemctl --user unset-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE; systemctl --user stop xdg-desktop-portal.service xdg-desktop-portal-gtk.service xdg-desktop-portal-hyprland.service'

# Tiling behaviour: pick split direction from the focused window's shape.
exec_always --no-startup-id autotiling

# Notifications.
exec --no-startup-id dunst

# Polkit authentication agent (pkexec / virt-manager-style prompts).
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# NetworkManager tray applet (shows in the i3bar tray).
exec --no-startup-id nm-applet

# SPICE guest agent: shared clipboard and automatic display resize.
# The system half is spice-vdagentd.socket. (Window-size resize is not its job: see x11-autoresize below.) Only in a VM: on bare metal the
# package is not even installed (install.sh).
exec --no-startup-id sh -c 'systemd-detect-virt -q --vm && exec spice-vdagent' 

# Follow the host window size. A virtio GPU reports it as the monitor's preferred
# mode, which nothing applies by itself; vm/x11-autoresize does, on i3's `output`
# event. Plain `exec`, not exec_always: one listener per session, not per reload.
# vm/x11-autoresize is linked by install_vm.sh only, so this is a no-op elsewhere.
exec --no-startup-id sh -c 'command -v x11-autoresize >/dev/null && exec x11-autoresize'

exec --no-startup-id numlockx on

# Clipboard history (CopyQ, with its tray icon). bin/x11-clipboard drives it
# from rofi: $mod+Ctrl+v to pick, $mod+Shift+Ctrl+Mod1+v to wipe.
exec --no-startup-id copyq

# Dictation daemon. Not voxtype.service: that is wanted by graphical-session.target,
# which a bare i3 session never reaches. Needs a model: `voxtype setup --download`
# (install.sh does it). Not an X client, so it outlives the session that started
# it; one left by the other session (bin/cachy-session) carries that session's
# environment, so it is replaced.
exec --no-startup-id sh -c 'command -v voxtype >/dev/null || exit 0; pkill -x -u "$(id -u)" voxtype && sleep 1; exec voxtype -q daemon'

# Idle handling (bin/x11-idle init): with xss-lock installed, lock before suspend
# and after 10 idle minutes (the X screensaver timer it watches;
# --transfer-sleep-lock holds suspend until the screen is actually locked, and
# bin/x11-lock execs i3lock --nofork for exactly that). Without it (the vm
# profile) the screen saver and DPMS are turned off, so the display never blanks.
# $mod+Ctrl+i toggles the whole thing off and on.
exec --no-startup-id $bin/x11-idle init

# Bluetooth tray applet, only when there is an adapter (none in a VM).
exec --no-startup-id sh -c '[ -n "$(ls -A /sys/class/bluetooth 2>/dev/null)" ] && exec blueman-applet'

# Wallpaper: painted at login, and repainted whenever the monitor layout changes
# (04-monitors.conf's xrandr runs concurrently with this; a hotplug; a VM window
# resize). bin/x11-wallpaper's header says why it watches i3's output events
# instead of painting once. Plain `exec`: one watcher per session.
exec --no-startup-id $bin/x11-wallpaper watch

# Outputs, then wallpaper (bin/x11-display): in a VM it pins 1920x1080 with
# x11-monitor; on bare metal autorandr applies the saved profile for the connected
# outputs (or lays them out left to right). Off: the monitor layout is per host now,
# in conf.d/04-monitors.conf.
# exec_always --no-startup-id $bin/x11-display

