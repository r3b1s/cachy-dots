# Core tiling: focus, move, resize, layouts, fullscreen, floating.
#
# autotiling (05-autostart.conf) chooses split direction automatically; the
# split / layout binds below are manual overrides on top of that.

# ── general ───────────────────────────────────────────────────────────────

# Re-pressing a workspace key jumps back (workspace_back_and_forth everywhere).
workspace_auto_back_and_forth yes

# ── focus ─────────────────────────────────────────────────────────────────

# The pointer follows the focus: bin/x11-focus runs `focus <dir>` and warps the
# pointer to the centre of the window that took it.
bindsym $mod+h exec --no-startup-id $bin/x11-focus left
bindsym $mod+j exec --no-startup-id $bin/x11-focus down
bindsym $mod+k exec --no-startup-id $bin/x11-focus up
bindsym $mod+l exec --no-startup-id $bin/x11-focus right

bindsym $mod+Left exec --no-startup-id $bin/x11-focus left
bindsym $mod+Down exec --no-startup-id $bin/x11-focus down
bindsym $mod+Up exec --no-startup-id $bin/x11-focus up
bindsym $mod+Right exec --no-startup-id $bin/x11-focus right

# Container tree navigation (replaces the master-layout roll binds).
bindsym $mod+n focus parent
bindsym $mod+Shift+n focus child

# ── move windows ──────────────────────────────────────────────────────────

# hyprland swap → i3 move (i3's only directional move within a workspace)
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# hyprland "move without swapping" → move to the adjacent output instead
bindsym $mod+Shift+Ctrl+h move container to output left
bindsym $mod+Shift+Ctrl+j move container to output down
bindsym $mod+Shift+Ctrl+k move container to output up
bindsym $mod+Shift+Ctrl+l move container to output right

# Nudge floating windows for manual repositioning.
bindsym $mod+Shift+Mod1+h move left 20 px
bindsym $mod+Shift+Mod1+j move down 20 px
bindsym $mod+Shift+Mod1+k move up 20 px
bindsym $mod+Shift+Mod1+l move right 20 px

# ── resize ────────────────────────────────────────────────────────────────

# delta-resize equivalent: ~5% of the monitor per press, no script needed.
bindsym $mod+Ctrl+h resize grow width 100 px or 6 ppt
bindsym $mod+Ctrl+l resize shrink width 100 px or 6 ppt
bindsym $mod+Ctrl+k resize grow height 100 px or 6 ppt
bindsym $mod+Ctrl+j resize shrink height 100 px or 6 ppt

# ── window state ──────────────────────────────────────────────────────────

bindsym $mod+w kill

# hyprland's 4-way fullscreen matrix collapses to i3's single toggle;
# both old muscle-memory chords land on it.
bindsym $mod+f fullscreen toggle
bindsym $mod+Mod1+f fullscreen toggle

bindsym $mod+Shift+Ctrl+Mod1+f floating toggle

# Jump between the tiling and floating layers (upstream binds this to $mod+space,
# which we spend on dmenu_run; $mod+Shift+Ctrl+space is the theme switcher).
bindsym $mod+Shift+Ctrl+Mod1+space focus mode_toggle

# ── layouts (replaces the hyprland master-layout binds) ───────────────────

bindsym $mod+s layout toggle tabbed split
bindsym $mod+Shift+s layout toggle stacking split
bindsym $mod+Ctrl+s split toggle
bindsym $mod+Mod1+BackSpace layout toggle all

# ── appearance cycles ─────────────────────────────────────────────────────

bindsym $mod+Shift+BackSpace exec --no-startup-id $bin/x11-gaps-cycle

# Toggle the bar declared in 15-bar.conf.
bindsym $mod+Shift+space bar mode toggle

# ── i3 session ────────────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+c reload
bindsym $mod+Shift+Ctrl+Mod1+w restart

# Reload, then repaint the wallpaper.
#
# The reload already re-runs every exec_always, which redraws the wallpaper; the
# second command runs it again after the reload has settled. Note that each
# command after a ';' needs its own `exec`: i3 parses the rest of the line as a
# new command, so a bare `$bin/x11-wallpaper` was rejected at runtime with
# "Expected one of these tokens: ... 'exec' ..." (i3 -C does not catch that) and
# only the reload ran.
bindsym $mod+Shift+r exec --no-startup-id i3-msg reload; exec --no-startup-id $bin/x11-wallpaper
