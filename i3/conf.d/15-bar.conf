# The i3bar, fed by i3status-rust. Its blocks live in
# ../../i3status-rust/config.toml.tpl, a template x11-theme renders with the
# active theme's colours into the state directory below.
#
# i3bar also hosts the system tray (nm-applet) natively; that is separate from
# status_command, which is why i3status-rs does not have to be the only thing
# on the bar.
#
# `bar` blocks cannot be split across includes, so the bar colours are declared
# here rather than in 01-colors.conf. Both use the theme's $th_* variables.

bar {
    position top
    status_command i3status-rs ~/.local/state/omarchy/current/theme/i3status-rust.config.toml

    colors {
        background $th_bg
        statusline $th_fg
        separator  $th_bg_light

        #class              #border        #backgr        #text
        focused_workspace   $th_accent     $th_accent     $th_bg
        active_workspace    $th_accent_dim $th_accent_dim $th_fg
        inactive_workspace  $th_bg         $th_bg         $th_fg_dim
        urgent_workspace    $th_urgent     $th_urgent     $th_bg
        binding_mode        $th_accent_dim $th_accent_dim $th_fg
    }
}
