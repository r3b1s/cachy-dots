# Monitor layout for this host. install.sh and sync.sh copy this file to
# ~/.config/i3/conf.d/04-monitors.conf, and only when that file is missing: the copy
# is yours, and neither script ever overwrites it. It is not linked into the repo,
# so one host's layout never shows up on another. To start over, delete the copy
# and run ./sync.sh.
#
# Loaded before 05-autostart.conf. Each example is one `xrandr` call with one output
# per line; a trailing backslash continues the command on the next line. Output
# names are listed by `xrandr --query`. Uncomment one example, or write your own.
#
# `exec` runs once when i3 starts, so a reload ($mod+Shift+r) does not repeat it.
#
# Single monitor:
#
#   exec --no-startup-id xrandr \
#       --output DP-1 --primary --mode 1920x1080 --rate 60 --pos 0x0 --rotate normal
#
# Dual monitors, side by side (left, then right):
#
#   exec --no-startup-id xrandr \
#       --output DP-1 --primary --mode 2560x1440 --rate 144 --pos 0x0 --rotate normal \
#       --output HDMI-1 --mode 1920x1080 --rate 60 --pos 2560x0 --rotate normal
#
# Dual monitors, vertically stacked (HDMI-1 below DP-1):
#
#   exec --no-startup-id xrandr \
#       --output DP-1 --primary --mode 1920x1080 --rate 60 --pos 0x0 --rotate normal \
#       --output HDMI-1 --mode 1920x1080 --rate 60 --pos 0x1080 --rotate normal
#
# Triple monitors, side by side (DP-1 in the middle and primary):
#
#   exec --no-startup-id xrandr \
#       --output HDMI-1 --mode 1920x1080 --rate 60 --pos 0x0 --rotate normal \
#       --output DP-1 --primary --mode 2560x1440 --rate 144 --pos 1920x0 --rotate normal \
#       --output DP-2 --mode 1920x1080 --rate 60 --pos 4480x0 --rotate normal
