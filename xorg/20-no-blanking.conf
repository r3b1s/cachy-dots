# Installed by the vm profile (setup_no_sleep in install/system.sh) into
# /etc/X11/xorg.conf.d/. X's own defaults blank the screen after 10 idle minutes
# and power it off through DPMS; a guest's display must stay on. bin/x11-idle
# repeats this at session start with xset, for a server these flags did not reach.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
