# Touchpads (libinput): tap to click, two-finger tap for the right button, and
# no pointer jumps while typing. Installed by install.sh into
# /etc/X11/xorg.conf.d/ (X reads only root-owned config there). Matches nothing
# on a machine without a touchpad, such as a VM.
Section "InputClass"
    Identifier "cachy-dots touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "DisableWhileTyping" "on"
    Option "NaturalScrolling" "false"
    Option "ClickMethod" "clickfinger"
EndSection
