# kitty. Colours come from the active theme (x11-theme renders omarchy's
# kitty.conf.tpl); x11-theme sends kitty SIGUSR1 after a switch to reload.
include ${HOME}/.local/state/omarchy/current/theme/kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        9.0
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no

# Carried over from alacritty.
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
map shift+enter  send_text all \x1b\r
