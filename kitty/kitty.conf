# kitty. Colours come from colors.conf, a link the active session points
# (install/session.sh): x11-theme's render of omarchy's kitty.conf.tpl under i3,
# dux's dank-theme.conf under Hyprland. Both send kitty SIGUSR1 to reload. The
# font family is font.conf, pointed the same way: font-i3.conf or
# font-hyprland.conf (dux's mono font).
include colors.conf
include font.conf

font_size        9.0
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no

# Carried over from alacritty.
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
map shift+enter  send_text all \x1b\r
